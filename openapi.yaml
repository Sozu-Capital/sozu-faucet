openapi: 3.1.0
info:
  title: Sozu Faucet API
  version: 0.1.0
  description: Friendbot-like Circle USDC SAC faucet for Stellar testnet.
servers:
  - url: http://localhost:3010
    description: Local
paths:
  /api/v1/faucet/status:
    get:
      summary: Faucet identity + availability
      description: |
        Public. Optional `Authorization: Bearer`, or `?wallet=C…/G…` for that wallet's cooldown.
      parameters:
        - name: wallet
          in: query
          required: false
          schema:
            type: string
          description: Stellar C…/G… address for per-wallet cooldown
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/v1/faucet/prompt-token:
    post:
      summary: Mint short-lived Mode A JWT for Copy prompt
      description: |
        Human-gated (Turnstile when configured). Returns a ~5-minute wallet-bound JWT
        and a ready-to-paste agent prompt. Does not expose FAUCET_AUTH_SECRET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                captchaToken:
                  type: string
      responses:
        "200":
          description: Token + clipboard prompt
        "401":
          description: Captcha missing or failed
        "409":
          description: Wallet on cooldown / unavailable
  /api/v1/faucet/pow/challenge:
    post:
      summary: Mint a Mode C PoW challenge
      description: |
        Single-use ticket bound to `to`. CLI (`npx @sozu/faucet`) solves locally then claims.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  description: Recipient C… or G… address
      responses:
        "200":
          description: Challenge ticket
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, to, difficulty, prefix, expiresAt]
                properties:
                  challengeId: { type: string }
                  to: { type: string }
                  difficulty: { type: integer }
                  prefix: { type: string }
                  expiresAt: { type: string, format: date-time }
        "429":
          description: IP rate limited
  /api/v1/faucet/claim:
    post:
      summary: Claim testnet Circle USDC SAC
      description: |
        **Mode A (JWT auth):** Send `Authorization: Bearer <JWT>`. Optional body `{ to }` must match JWT wallet if provided.

        **Mode B (public paste):** No auth header. Body `{ to, captchaToken }` required.

        **Mode C (PoW / CLI):** No auth header. Body `{ to, pow: { challengeId, nonce } }` required.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  description: |
                    Recipient C… or G… address.
                    - Mode A: optional, must match JWT wallet if provided
                    - Mode B / Mode C: required
                slug:
                  type: string
                  default: sozu-testnet
                captchaToken:
                  type: string
                  description: |
                    Cloudflare Turnstile response token.
                    - Mode A: not used
                    - Mode B: required
                pow:
                  type: object
                  description: Mode C proof-of-work ticket solution
                  properties:
                    challengeId: { type: string }
                    nonce: { type: string }
      responses:
        "200":
          description: Funded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimSuccess"
        "409":
          description: Cooldown / empty day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimFailure"
        "503":
          description: Vault empty or misconfigured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimFailure"
  /api/health:
    get:
      summary: Ops health
      responses:
        "200":
          description: Health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StatusResponse:
      type: object
      required: [faucet, availability]
      properties:
        faucet:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            claimAmount: { type: number }
            dailyLimit: { type: number }
            status: { type: string, enum: [active, inactive] }
            asset: { type: string, enum: [circle_usdc_sac] }
            network: { type: string, enum: [testnet] }
            cooldownMinutes: { type: number }
        availability:
          type: object
          properties:
            available: { type: boolean }
            reason:
              type: string
              enum:
                [
                  inactive,
                  empty_today,
                  insufficient_vault,
                  global_cooldown,
                  user_cooldown,
                ]
            remainingToday: { type: number }
            nextAvailableAt: { type: string, format: date-time }
    ClaimSuccess:
      type: object
      required: [success, amount, asset, network, to, txHash, nextAvailableAt]
      properties:
        success: { type: boolean, enum: [true] }
        amount: { type: number }
        asset: { type: string, enum: [circle_usdc_sac] }
        network: { type: string, enum: [testnet] }
        to: { type: string }
        txHash: { type: string }
        nextAvailableAt: { type: string, format: date-time }
    ClaimFailure:
      type: object
      required: [success, amount, error, reason]
      properties:
        success: { type: boolean, enum: [false] }
        amount: { type: number }
        error: { type: string }
        reason: { type: string }
        nextAvailableAt: { type: string, format: date-time }
